name: Windows run-part CI-shell verification
on:
  push:
    branches: [probe/windows-ci-shell-iAXsqP]
permissions:
  contents: read
jobs:
  session:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
          cache: maven
          cache-dependency-path: client/pom.xml
      - name: Start retained diagnostic worker
        shell: pwsh
        run: |
          $process = Start-Process pwsh -ArgumentList '-NoProfile', '-File', 'probe/session.ps1' -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/session.log" -RedirectStandardError "$env:RUNNER_TEMP/session-error.log"
          $process.Id | Set-Content "$env:RUNNER_TEMP/session.pid"
          $deadline = [DateTime]::UtcNow.AddMinutes(3)
          while (!(Test-Path "$env:RUNNER_TEMP/cat-remote/connection.json")) {
            if ($process.HasExited) { Get-Content "$env:RUNNER_TEMP/session-error.log"; throw 'Session setup exited before publishing' }
            if ([DateTime]::UtcNow -ge $deadline) { throw 'Session setup did not publish connection details' }
            Start-Sleep -Seconds 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-connection
          path: ${{ runner.temp }}/cat-remote/connection.json
      - name: Wait for the connected operator to verify the patch
        id: ready
        shell: pwsh
        run: |
          $deadline = [DateTime]::UtcNow.AddMinutes(8)
          $root = Join-Path $env:RUNNER_TEMP 'cat-remote'
          while (!(Test-Path (Join-Path $root 'ready'))) {
            if ([DateTime]::UtcNow -ge $deadline) { throw 'No readiness receipt from the operator' }
            Start-Sleep -Seconds 2
          }
      - name: Install test tools on Windows
        id: tools
        if: steps.ready.outcome == 'success'
        run: |
          shellcheck_directory="$(cygpath --unix "${RUNNER_TEMP}")/shellcheck"
          archive="${shellcheck_directory}/shellcheck.zip"
          mkdir -p "${shellcheck_directory}"
          curl -fsSL --retry 3 --retry-all-errors -o "${archive}" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.zip
          echo "8a4e35ab0b331c85d73567b12f2a444df187f483e5079ceffa6bda1faa2e740e  ${archive}" |
            sha256sum --check --strict
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath --windows "${archive}")' -DestinationPath \
            '$(cygpath --windows "${shellcheck_directory}")'"
          cygpath --windows "${shellcheck_directory}" >> "${GITHUB_PATH}"
          "${shellcheck_directory}/shellcheck.exe" --version
          npm install --global bats@1.13.0
          bats --version
      - name: Verify
        id: verify
        if: steps.ready.outcome == 'success' && steps.tools.outcome == 'success'
        run: client/mvnw -f client/pom.xml --fail-at-end verify
      - name: Verify bootstrap boundaries on Windows
        id: bats
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: >-
          bats client/common/distribution/src/test/bats/bootstrap-common.bats
          client/common/distribution/src/test/bats/bootstrap-claude.bats
          client/common/distribution/src/test/bats/bootstrap-codex.bats
          client/common/distribution/src/test/bats/bootstrap-windows.bats
          client/common/distribution/src/test/bats/codex-plugin-launchers-windows.bats
          client/common/distribution/src/test/bats/installer-launcher-windows.bats
      - name: Record the verification results
        if: always()
        shell: pwsh
        env:
          CAT_TOOLS: ${{ steps.tools.outcome }}
          CAT_VERIFY: ${{ steps.verify.outcome }}
          CAT_BATS: ${{ steps.bats.outcome }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cat-remote'
          $result = @{ tools = $env:CAT_TOOLS; verify = $env:CAT_VERIFY; bats = $env:CAT_BATS }
          $result | ConvertTo-Json -Compress | Set-Content (Join-Path $root 'ci-shell-result.tmp')
          Move-Item (Join-Path $root 'ci-shell-result.tmp') (Join-Path $root 'ci-shell-result.json')
      - name: Wait until the diagnostic shell exits
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP/session.pid") {
            $sessionProcessId = [int](Get-Content "$env:RUNNER_TEMP/session.pid")
            Wait-Process -Id $sessionProcessId -ErrorAction SilentlyContinue
          }
          if (Test-Path "$env:RUNNER_TEMP/cat-remote/upterm.exe") {
            & "$env:RUNNER_TEMP/cat-remote/upterm.exe" session wait cat-windows
            & "$env:RUNNER_TEMP/cat-remote/upterm.exe" session info cat-windows --output json | Set-Content "$env:RUNNER_TEMP/cat-remote/terminal.json"
          }
          Get-Content "$env:RUNNER_TEMP/session.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP/session-error.log" -ErrorAction SilentlyContinue
          if (!(Test-Path "$env:RUNNER_TEMP/cat-remote/terminal.json")) { throw 'No terminal session receipt' }
          $terminal = Get-Content "$env:RUNNER_TEMP/cat-remote/terminal.json" -Raw | ConvertFrom-Json
          if ($terminal.status -ne 'ended') { throw 'Remote session is not terminal' }
          if ($terminal.reason -ne 'exited') { throw "Remote session ended without an explicit shell exit: $($terminal.reason)" }
          exit $terminal.exitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-session-result
          path: |
            ${{ runner.temp }}/cat-remote/terminal.json
            ${{ runner.temp }}/cat-remote/*result*
            ${{ runner.temp }}/session*.log
      - name: Remove task access after session wait
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/cat-remote" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force
          Write-Output 'CAT_REMOTE_CLEANUP_FINISHED'
