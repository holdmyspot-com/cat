name: Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-26.04
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
          - platform: macos-x64
            runner: macos-26-intel
          - platform: macos-arm64
            runner: macos-26
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
          cache: maven
          cache-dependency-path: client/pom.xml
      - name: Install test tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bats shellcheck
      - name: Install test tools on macOS
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck
      # Chocolatey reports success without installing anything when its package feed is unavailable, so the step
      # retries until shellcheck is on the PATH and fails here, rather than later in the build, if it never is.
      - name: Install test tools on Windows
        if: runner.os == 'Windows'
        run: |
          for attempt in 1 2 3; do
            if choco install shellcheck --yes --no-progress && command -v shellcheck > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Chocolatey did not install shellcheck after 3 attempts"
              exit 1
            fi
            sleep 30
          done
          npm install --global bats@1.11.1
          shellcheck --version
          bats --version
      - name: Verify
        run: client/mvnw -f client/pom.xml verify
      # The job log names a failing module but not why its tests could not run; the reports and dump files hold that.
      - name: Keep the test reports of a failed Windows build
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.platform }}
          path: client/**/target/surefire-reports/
          if-no-files-found: ignore
      - name: Verify bootstrap boundaries
        if: runner.os != 'Windows'
        run: >-
          bats client/common/distribution/src/test/bats/bootstrap-common.bats
          client/common/distribution/src/test/bats/bootstrap-claude.bats
          client/common/distribution/src/test/bats/bootstrap-codex.bats
      # Claude Code installs CAT from Git Bash on Windows, and Codex from PowerShell, which the Maven build tests
      - name: Verify bootstrap boundaries on Windows
        if: runner.os == 'Windows'
        run: >-
          bats client/common/distribution/src/test/bats/bootstrap-common.bats
          client/common/distribution/src/test/bats/bootstrap-claude.bats
      - name: Verify the jlink launcher template
        if: runner.os != 'Windows'
        run: bats client/common/distribution/src/test/bats/jlink-launchers.bats
      - name: Verify the Codex plugin's part launchers
        if: runner.os != 'Windows'
        run: bats client/common/distribution/src/test/bats/codex-plugin-launchers.bats
