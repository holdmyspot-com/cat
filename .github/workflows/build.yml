name: Build private acceptance archives
on:
  push:
    branches:
      - rehearsal/native-package-189773d673a7
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 189773d673a7dfb5d27b2c91bdcd294d66fe88aa
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
          cache: maven
          cache-dependency-path: client/pom.xml
      - name: Install test tools
        run: .github/scripts/install-linux-test-tools.sh
      - name: Verify and package
        run: |
          test "$(git rev-parse HEAD)" = 189773d673a7dfb5d27b2c91bdcd294d66fe88aa
          test -z "$(git status --porcelain)"
          client/mvnw -q -f client/pom.xml verify -Dcat.build=189773d673a7
      - name: Verify native archive checksums
        working-directory: client/common/distribution/target/release
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Upload native archives
        uses: actions/upload-artifact@v7
        with:
          name: cat-linux-x64-189773d673a7
          if-no-files-found: error
          retention-days: 1
          path: |
            client/common/distribution/target/release/cat-*-*.tar.gz
            client/common/distribution/target/release/SHA256SUMS.txt
            client/common/distribution/target/release/cat-release-assets-*.json
