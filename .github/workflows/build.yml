name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
          cache: maven
          cache-dependency-path: client/pom.xml
      - name: Install test tools on Linux
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-test-tools.sh
      - name: Install test tools on macOS
        if: runner.os == 'macOS'
        run: brew install bats-core jq shellcheck
      # Chocolatey's community feed can be unavailable to GitHub's runners, and choco then reports success without
      # installing anything, so ShellCheck comes from its own GitHub release, pinned by checksum.
      - name: Install test tools on Windows
        if: runner.os == 'Windows'
        run: |
          shellcheck_directory="$(cygpath --unix "${RUNNER_TEMP}")/shellcheck"
          archive="${shellcheck_directory}/shellcheck.zip"
          mkdir -p "${shellcheck_directory}"
          curl -fsSL --retry 3 --retry-all-errors -o "${archive}" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.zip
          echo "8a4e35ab0b331c85d73567b12f2a444df187f483e5079ceffa6bda1faa2e740e  ${archive}" |
            sha256sum --check --strict
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath --windows "${archive}")' -DestinationPath \
            '$(cygpath --windows "${shellcheck_directory}")'"
          cygpath --windows "${shellcheck_directory}" >> "${GITHUB_PATH}"
          "${shellcheck_directory}/shellcheck.exe" --version
          npm install --global bats@1.13.0
          bats --version
      # A push to a branch builds the release's packages, which embed the public half of the release signing key, so
      # that CAT can check a release's signed manifest, and the commit's first 12 hexadecimal digits as the build
      # stamp. The Release workflow publishes these packages for the commit that its tag names. A pull request, and a
      # push where the secret is unavailable, as in a fork, builds and tests without the key and uploads nothing.
      - name: Derive release public key
        id: release-key
        if: github.event_name == 'push'
        env:
          CAT_RELEASE_SIGNING_KEY: ${{ secrets.CAT_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${CAT_RELEASE_SIGNING_KEY}" ]; then
            echo "::warning::The secret CAT_RELEASE_SIGNING_KEY is unavailable, so this build uploads no release" \
              "packages."
            echo "public-key=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "public-key=$(.github/scripts/release-packages.sh public-key)" >> "${GITHUB_OUTPUT}"
      - name: Verify
        env:
          CAT_RELEASE_PUBLIC_KEY: ${{ steps.release-key.outputs.public-key }}
        run: |
          if [ -n "${CAT_RELEASE_PUBLIC_KEY}" ]; then
            client/mvnw -f client/pom.xml verify "-Dcat.release.public-key=${CAT_RELEASE_PUBLIC_KEY}" \
              "-Dcat.build=${GITHUB_SHA::12}"
          else
            client/mvnw -f client/pom.xml verify
          fi
      # The job log names a failing module but not why its tests could not run; the reports and dump files hold that.
      - name: Keep the test reports of a failed Windows build
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.platform }}
          path: client/**/target/surefire-reports/
          if-no-files-found: ignore
      - name: Keep the startup-hook test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hook-test-reports
          path: client/codex/cli/target/surefire-reports/*CodexHookProcessTest*
          if-no-files-found: warn
      - name: Install Codex for the startup-hook probe
        if: always()
        shell: pwsh
        run: |
          npm install --global '@openai/codex@0.172.0'
          $codex = (Get-ChildItem -Recurse -Filter codex.exe (Join-Path (npm root -g) '@openai') |
            Where-Object { $_.FullName -like '*vendor*bin*codex.exe' } | Select-Object -First 1).FullName
          & $codex --version
          "CAT_HOOK_PROBE_CODEX=$codex" >> $env:GITHUB_ENV
          "CAT_HOOK_PROBE_EVIDENCE=$env:RUNNER_TEMP\hook-probe" >> $env:GITHUB_ENV
      - name: Startup-hook probe
        if: always()
        run: |
          cp probe/CodexHookWindowsProbeTest.java \
            client/codex/cli/src/test/java/com/holdmyspot/cat/codex/optimizer/test/
          client/mvnw -f client/pom.xml -pl codex/cli -am -Dtest=CodexHookWindowsProbeTest \
            -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip=true -Dpmd.skip=true test
      - name: Keep the startup-hook probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hook-probe
          path: ${{ runner.temp }}/hook-probe
          if-no-files-found: warn
      - name: Verify bootstrap boundaries
        if: runner.os != 'Windows'
        run: >-
          bats client/common/distribution/src/test/bats/bootstrap-common.bats
          client/common/distribution/src/test/bats/bootstrap-claude.bats
          client/common/distribution/src/test/bats/bootstrap-codex.bats
          client/common/distribution/src/test/bats/installer-launcher.bats
      # Claude Code installs CAT from Git Bash on Windows, and Codex from PowerShell through cat.ps1, which
      # bootstrap-windows.bats tests.
      # bootstrap-codex.bats runs the Windows Codex plugin's hooks through their .cmd launchers, as Codex does, because
      # that plugin has no POSIX launchers, and codex-plugin-launchers-windows.bats runs that plugin's batch launchers
      # from PowerShell. A Windows installation's installer launchers are PowerShell scripts, which
      # installer-launcher-windows.bats tests in place of installer-launcher.bats and its POSIX launchers.
      - name: Verify bootstrap boundaries on Windows
        if: runner.os == 'Windows'
        run: >-
          bats client/common/distribution/src/test/bats/bootstrap-common.bats
          client/common/distribution/src/test/bats/bootstrap-claude.bats
          client/common/distribution/src/test/bats/bootstrap-codex.bats
          client/common/distribution/src/test/bats/bootstrap-windows.bats
          client/common/distribution/src/test/bats/codex-plugin-launchers-windows.bats
          client/common/distribution/src/test/bats/installer-launcher-windows.bats
      # The installer's sources rewrite runs here, where the shell and sed are macOS's, as well as on Linux.
      - name: Verify the Linux test-tool installer's mirror rewrite
        if: runner.os != 'Windows'
        run: bats client/common/distribution/src/test/bats/install-linux-test-tools.bats
      # The POSIX launcher templates; codex-plugin-launchers-windows.bats tests the batch launchers on Windows
      - name: Verify the jlink launcher template
        if: runner.os != 'Windows'
        run: bats client/common/distribution/src/test/bats/jlink-launchers.bats
      - name: Verify the Codex plugin's part launchers
        if: runner.os != 'Windows'
        run: bats client/common/distribution/src/test/bats/codex-plugin-launchers.bats
      # The tests of the checks that Release makes of these packages
      - name: Verify the release package checks
        if: runner.os != 'Windows'
        run: bats client/common/distribution/src/test/bats/release-packages.bats
      - name: Verify native release checksums
        if: steps.release-key.outputs.public-key != '' && runner.os != 'macOS'
        working-directory: client/common/distribution/target/release
        run: sha256sum --check --strict SHA256SUMS.txt
      # Release downloads these files from the Build run of its tag's commit. Artifact storage is billed by the hour,
      # so they are kept for three days: time to tag a commit whose Build passed, and to re-run Release after a failure.
      - name: Upload native release files
        if: steps.release-key.outputs.public-key != ''
        uses: actions/upload-artifact@v7
        with:
          name: cat-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3
          path: |
            client/common/distribution/target/release/cat-*-*.tar.gz
            client/common/distribution/target/release/SHA256SUMS.txt
            client/common/distribution/target/release/cat-release-assets-*.json
