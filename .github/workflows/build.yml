name: Linux diagnostic session
on:
  push:
    branches: [diagnostic/linux-x64-b1e022]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
          cache: maven
          cache-dependency-path: client/pom.xml
      - name: Install matching test tools
        run: .github/scripts/install-linux-test-tools.sh
      - name: Prepare session identity
        run: |
          echo "RELEASE_SESSION_DIR=${RUNNER_TEMP}/cat-linux-diagnostic-${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"
          echo "RELEASE_SESSION_IDENTITY=${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}/linux-x64" >> "${GITHUB_ENV}"
      - name: Start private authenticated session
        env:
          SESSION_PUBLIC_KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBeByyhsg+8ChGs4Aj8M6Dd38AsKjRjzSjo5FfuyPD9l gili@STALKER'
        run: >-
          .github/scripts/release-session.sh start "${RELEASE_SESSION_DIR}" linux-x64
          "${SESSION_PUBLIC_KEY}" "${RELEASE_SESSION_IDENTITY}" "${GITHUB_SHA}" 600 "${GITHUB_WORKSPACE}"
      - name: Publish live connection
        uses: actions/upload-artifact@v7
        with:
          name: linux-connection-${{ github.run_id }}
          path: |
            ${{ env.RELEASE_SESSION_DIR }}/ssh-command
            ${{ env.RELEASE_SESSION_DIR }}/name
          if-no-files-found: error
          retention-days: 1
      - name: Wait for connected owner
        run: .github/scripts/release-session.sh wait-ready "${RELEASE_SESSION_DIR}" "${RELEASE_SESSION_IDENTITY}" "${GITHUB_SHA}" "${GITHUB_WORKSPACE}"
      - name: Hold worker for diagnostic commands
        if: always()
        run: .github/scripts/release-session.sh hold "${RELEASE_SESSION_DIR}"
      - name: Retain diagnostic evidence after shell exit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-evidence-${{ github.run_id }}
          path: |
            diagnostic-evidence/
            ${{ env.RELEASE_SESSION_DIR }}/terminal-receipt.json
          if-no-files-found: warn
          retention-days: 3
      - name: Clean up session
        if: always()
        run: .github/scripts/release-session.sh cleanup "${RELEASE_SESSION_DIR}"
