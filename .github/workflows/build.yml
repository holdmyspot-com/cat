name: Reproduce request server on macOS ARM64

on:
  push:
    branches:
      - rehearsal/request-server-macos-52cc6525

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
          cache: maven
          cache-dependency-path: client/pom.xml
      - name: Prepare the authorized diagnostic session
        shell: bash
        env:
          GUEST_KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEyv7YmxanZQqIXuuTiFiqpfodaUfYiHwzZtSKFxKUJX cat-macos-diagnostic'
          RELAY_CA: '@cert-authority [uptermd.upterm.dev]:443 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICiecex8Dq718eSe1CCLgLvDmI7AagvCtax7brPFWkh4'
        run: |
          set -euo pipefail
          umask 077
          debug="$RUNNER_TEMP/cat-request-debug"
          mkdir -p "$debug/receipts" "$debug/runtime"
          cd "$debug"
          curl --fail --silent --show-error --location --output upterm.tar.gz https://github.com/owenthereal/upterm/releases/download/v0.41.1/upterm_darwin_arm64.tar.gz
          printf '%s  %s\n' '47076b7012ec914d403e6c8d91de80732ac8d6dba5e8d62439f1bfcce5f15c86' 'upterm.tar.gz' | shasum -a 256 --check
          tar -xzf upterm.tar.gz upterm
          printf '%s\n' "$GUEST_KEY" > guest.pub
          ssh-keygen -lf guest.pub
          printf '%s\n' "$RELAY_CA" > known_hosts
          awk '{print $3, $4}' known_hosts > relay.public
          ssh-keygen -lf relay.public | grep -F 'SHA256:9ajV8JqMe6jJE/s3TYjb/9xw7T0pfJ2+gADiBIJWDPE'
          cat > debug.rc <<'RC'
          readonly TMOUT=600
          PS1='cat-debug$ '
          cd "$GITHUB_WORKSPACE"
          RC
          export XDG_RUNTIME_DIR="$debug/runtime"
          ./upterm host --detach --accept --name cat-request-server --output json \
            --server wss://uptermd.upterm.dev --join-timeout 10m --known-hosts known_hosts \
            --authorized-keys guest.pub -- /bin/bash --noprofile --rcfile "$debug/debug.rc" -i > session.json
          jq -e '{sshCommand,joinCommand,joinDeadline}' session.json > connection.json
      - name: Publish connection details while the runner is alive
        uses: actions/upload-artifact@v7
        with:
          name: request-server-connection
          path: ${{ runner.temp }}/cat-request-debug/connection.json
          if-no-files-found: error
          retention-days: 1
      - name: Wait for the diagnostic shell to exit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          debug="$RUNNER_TEMP/cat-request-debug"
          cd "$debug"
          test -s session.json
          export XDG_RUNTIME_DIR="$debug/runtime"
          ./upterm session wait cat-request-server
          test -s receipts/operator-result.txt
      - name: Retain the diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: request-server-diagnostics
          path: ${{ runner.temp }}/cat-request-debug/receipts/
          if-no-files-found: ignore
          retention-days: 1
      - name: Clean the diagnostic session files
        if: always()
        shell: bash
        run: |
          debug="$RUNNER_TEMP/cat-request-debug"
          if test -x "$debug/upterm"; then
            XDG_RUNTIME_DIR="$debug/runtime" "$debug/upterm" session stop cat-request-server 2>/dev/null || true
          fi
          rm -rf -- "$debug"
