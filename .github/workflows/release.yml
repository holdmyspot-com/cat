name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-26.04
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
          - platform: macos-x64
            runner: macos-26-intel
          - platform: macos-arm64
            runner: macos-26
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
          cache: maven
          cache-dependency-path: client/pom.xml
      - name: Install test tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bats shellcheck
      - name: Install test tools on macOS
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck
      # Chocolatey's community feed can be unavailable to GitHub's runners, and choco then reports success without
      # installing anything, so ShellCheck comes from its own GitHub release, pinned by checksum.
      - name: Install test tools on Windows
        if: runner.os == 'Windows'
        run: |
          shellcheck_directory="$(cygpath --unix "${RUNNER_TEMP}")/shellcheck"
          archive="${shellcheck_directory}/shellcheck.zip"
          mkdir -p "${shellcheck_directory}"
          curl -fsSL --retry 3 --retry-all-errors -o "${archive}" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.zip
          echo "8a4e35ab0b331c85d73567b12f2a444df187f483e5079ceffa6bda1faa2e740e  ${archive}" |
            sha256sum --check --strict
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath --windows "${archive}")' -DestinationPath \
            '$(cygpath --windows "${shellcheck_directory}")'"
          cygpath --windows "${shellcheck_directory}" >> "${GITHUB_PATH}"
          "${shellcheck_directory}/shellcheck.exe" --version
          npm install --global bats@1.11.1
          bats --version
      # The build embeds the public half of the release signing key, so that CAT can check the release's signed manifest
      - name: Derive release public key
        id: release-key
        env:
          CAT_RELEASE_SIGNING_KEY: ${{ secrets.CAT_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${CAT_RELEASE_SIGNING_KEY}" ]; then
            echo "The secret CAT_RELEASE_SIGNING_KEY is empty or unavailable to this workflow." >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/cat-release-signing-key.pem"
          (umask 077 && printf '%s\n' "${CAT_RELEASE_SIGNING_KEY}" > "${key_file}")
          public_key="$(openssl pkey -in "${key_file}" -pubout -outform DER | base64 | tr -d '\r\n')"
          rm -f "${key_file}"
          if [ -z "${public_key}" ]; then
            echo "CAT_RELEASE_SIGNING_KEY holds no private key that openssl can read." >&2
            exit 1
          fi
          echo "public-key=${public_key}" >> "${GITHUB_OUTPUT}"
      - name: Verify and package
        env:
          CAT_RELEASE_PUBLIC_KEY: ${{ steps.release-key.outputs.public-key }}
        # Each plugin version names the release commit by its first 12 hexadecimal digits
        run: >-
          client/mvnw -f client/pom.xml verify "-Dcat.release.public-key=${CAT_RELEASE_PUBLIC_KEY}"
          "-Dcat.build=${GITHUB_SHA::12}"
      - name: Verify native release checksums
        if: runner.os != 'macOS'
        working-directory: client/common/distribution/target/release
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Verify release tag
        run: |
          version="$(client/mvnw -q -f client/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match the Maven project version ${version}; " \
              "create tag v${version}." >&2
            exit 1
          fi
      - name: Verify bootstrap boundaries
        if: runner.os != 'Windows'
        run: >-
          bats client/common/distribution/src/test/bats/bootstrap-common.bats
          client/common/distribution/src/test/bats/bootstrap-claude.bats
          client/common/distribution/src/test/bats/bootstrap-codex.bats
          client/common/distribution/src/test/bats/installer-launcher.bats
      # Claude Code installs CAT from Git Bash on Windows, and Codex from PowerShell, which the Maven build tests.
      # bootstrap-codex.bats runs the Windows Codex plugin's hooks through their .cmd launchers, as Codex does, because
      # that plugin has no POSIX launchers. A Windows installation's installer launchers are PowerShell scripts, which
      # installer-launcher-windows.bats tests in place of installer-launcher.bats and its POSIX launchers.
      - name: Verify bootstrap boundaries on Windows
        if: runner.os == 'Windows'
        run: >-
          bats client/common/distribution/src/test/bats/bootstrap-common.bats
          client/common/distribution/src/test/bats/bootstrap-claude.bats
          client/common/distribution/src/test/bats/bootstrap-codex.bats
          client/common/distribution/src/test/bats/installer-launcher-windows.bats
      # The POSIX launcher templates; the Windows plugins' batch launchers are tested by the Maven build
      - name: Verify the jlink launcher template
        if: runner.os != 'Windows'
        run: bats client/common/distribution/src/test/bats/jlink-launchers.bats
      - name: Verify the Codex plugin's part launchers
        if: runner.os != 'Windows'
        run: bats client/common/distribution/src/test/bats/codex-plugin-launchers.bats
      - name: Upload native release files
        uses: actions/upload-artifact@v7
        with:
          name: cat-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          path: |
            client/common/distribution/target/release/cat-*-*.tar.gz
            client/common/distribution/target/release/SHA256SUMS.txt
            client/common/distribution/target/release/cat-release-assets-*.json

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/release-notes.md
            client/common/lifecycle/src/main/release/
          sparse-checkout-cone-mode: false
      - name: Download native release files
        uses: actions/download-artifact@v8
        with:
          pattern: cat-*
          path: native
      - name: Assemble release
        run: |
          mkdir release
          find native -type f -name 'cat-*-*.tar.gz' -exec cp '{}' release/ \;
          find native -type f -name SHA256SUMS.txt -exec cat '{}' \; | LC_ALL=C sort > release/SHA256SUMS.txt
          test "$(find release -type f -name 'cat-*-*.tar.gz' | wc -l)" -eq 10
          test "$(wc -l < release/SHA256SUMS.txt)" -eq 10
          mkdir fragments
          find native -type f -name 'cat-release-assets-*.json' -exec cp '{}' fragments/ \;
          test "$(find fragments -type f | wc -l)" -eq 5
      # The manifest lists every platform's archives, sorted by name, under the release's tag, release commit and
      # publication time. Every platform must have built the archives from the same commit.
      - name: Write release manifest
        run: |
          jq -s --arg tag "${GITHUB_REF_NAME}" --arg build "${GITHUB_SHA::12}" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            'if all(.[]; .build == $build) then
              {format: 1, product: "cat", version: ($tag | ltrimstr("v")), tag: $tag, build: $build,
                published: $published, assets: (map(.assets) | add | sort_by(.name))}
            else error("A platform built its archives from another commit than " + $build) end' \
            fragments/*.json > release/cat-release-manifest.json
          test "$(jq '.assets | length' release/cat-release-manifest.json)" -eq 10
      - name: Sign release manifest
        env:
          CAT_RELEASE_SIGNING_KEY: ${{ secrets.CAT_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${CAT_RELEASE_SIGNING_KEY}" ]; then
            echo "The secret CAT_RELEASE_SIGNING_KEY is empty or unavailable to this workflow." >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/cat-release-signing-key.pem"
          trap 'rm -f "${key_file}"' EXIT
          (umask 077 && printf '%s\n' "${CAT_RELEASE_SIGNING_KEY}" > "${key_file}")
          openssl pkey -in "${key_file}" -pubout -out "${RUNNER_TEMP}/cat-release-public-key.pem"
          openssl pkeyutl -sign -inkey "${key_file}" -rawin -in release/cat-release-manifest.json \
            -out "${RUNNER_TEMP}/cat-release-manifest.sig.bin"
          base64 < "${RUNNER_TEMP}/cat-release-manifest.sig.bin" | tr -d '\r\n' > release/cat-release-manifest.json.sig
          # Verifies the published signature, decoded again, against the public key that the build embedded
          base64 -d < release/cat-release-manifest.json.sig > "${RUNNER_TEMP}/cat-release-manifest.check.bin"
          if ! openssl pkeyutl -verify -pubin -inkey "${RUNNER_TEMP}/cat-release-public-key.pem" -rawin \
            -in release/cat-release-manifest.json -sigfile "${RUNNER_TEMP}/cat-release-manifest.check.bin"; then
            echo "The release manifest's signature does not verify against the release public key." >&2
            exit 1
          fi
          fingerprint="$(openssl pkey -in "${key_file}" -pubout -outform DER | sha256sum | awk '{ print $1 }')"
          echo "CAT_KEY_FINGERPRINT=${fingerprint}" >> "${GITHUB_ENV}"
      # The entry script embeds the release's tag and every archive's SHA-256 digest, and downloads only from the
      # release
      - name: Write entry scripts
        run: |
          release_sources=client/common/lifecycle/src/main/release
          sh "${release_sources}/generate-cat-sh.sh" "${release_sources}/cat.sh" "${GITHUB_REF_NAME}" \
            release/SHA256SUMS.txt release/cat.sh
          sh "${release_sources}/generate-cat-sh.sh" "${release_sources}/cat.ps1" "${GITHUB_REF_NAME}" \
            release/SHA256SUMS.txt release/cat.ps1
          # 10 archives, SHA256SUMS.txt, the manifest, its signature, cat.sh and cat.ps1
          test "$(find release -type f | wc -l)" -eq 15
      # The notes start with the agent pointer and this release's install commands, followed by the notes that GitHub
      # generates, which end with the link to the full changelog
      - name: Write release notes
        run: |
          test -n "${CAT_KEY_FINGERPRINT}"
          # The template's placeholders are matched literally, not expanded
          # shellcheck disable=SC2016
          sed -e 's/${GITHUB_REF_NAME}/'"${GITHUB_REF_NAME}"'/g' -e 's/${CAT_KEY_FINGERPRINT}/'"${CAT_KEY_FINGERPRINT}"'/g' .github/release-notes.md > "${RUNNER_TEMP}/release-notes.md"
          # A literal ${ left in the notes is a placeholder that was not replaced
          # shellcheck disable=SC2016
          if grep -F '${' "${RUNNER_TEMP}/release-notes.md"; then
            echo "The release notes template holds a placeholder other than \${GITHUB_REF_NAME} and" \
              "\${CAT_KEY_FINGERPRINT}." >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}"
          --title "CAT ${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md" --generate-notes

  # Artifact storage is billed by the hour, so delete the native release files once publishing ends instead of
  # keeping them for their retention period. This also runs when a build or the publish job fails.
  cleanup:
    name: Delete native release files
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Delete native release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("cat-")) | .id' |
          while read -r id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
