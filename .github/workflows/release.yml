name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - '*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: client/pom.xml
      - name: Install test tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bats shellcheck
      - name: Install test tools on macOS
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck
      - name: Verify release tag
        run: |
          version="$(client/mvnw -q -f client/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match the Maven project version ${version}; create tag ${version}." >&2
            exit 1
          fi
      - name: Verify and package native target
        run: client/mvnw -q -Dmaven.build.cache.enabled=false -f client/pom.xml verify package
      - name: Record native platform evidence
        run: >-
          client/release/test-platform-matrix.sh --record
          client/common/distribution/target/release/personal
          client/common/distribution/target/release/commercial
          "${GITHUB_REF_NAME}"
          client/common/distribution/target/release/platform-receipt.json
      - name: Upload native release inputs
        uses: actions/upload-artifact@v7
        with:
          name: cat-${{ matrix.platform }}
          if-no-files-found: error
          path: client/common/distribution/target/release/

  publish:
    name: Assemble, gate, and publish editions
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
          cache-dependency-path: client/pom.xml
      - name: Install release test tools
        run: sudo apt-get update && sudo apt-get install --yes bats shellcheck
      - name: Download native release inputs
        uses: actions/download-artifact@v8
        with:
          pattern: cat-*
          path: native
      - name: Assemble complete edition trees
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir inputs
          cp LICENSE.md README.md inputs/
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            mkdir -p "inputs/${platform}"
            cp -R "native/cat-${platform}/." "inputs/${platform}/"
          done
          mkdir platform-receipts
          cp native/cat-linux-x64/platform-receipt.json platform-receipts/linux-x86_64.json
          cp native/cat-linux-arm64/platform-receipt.json platform-receipts/linux-arm64.json
          cp native/cat-macos-x64/platform-receipt.json platform-receipts/macos-x86_64.json
          cp native/cat-macos-arm64/platform-receipt.json platform-receipts/macos-arm64.json
          client/mvnw -q -Dmaven.build.cache.enabled=false -f client/pom.xml -pl :client-distribution -am package
          java --module-path client/common/distribution/target/classes:client/common/distribution/target/modules \
            --module io.github.cowwoc.cat.distribution/io.github.cowwoc.cat.distribution.ReleaseTreeAssemblyMain \
            "${version}" inputs staged
      - name: Configure release credentials
        env:
          CAT_RELEASE_TOKEN: ${{ secrets.CAT_RELEASE_TOKEN }}
        run: |
          test -n "${CAT_RELEASE_TOKEN}"
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "${CAT_RELEASE_TOKEN}" > "${HOME}/.git-credentials"
      - name: Run frontend launch gate
        env:
          CAT_COMMERCIAL_TEST_REPOSITORY: https://github.com/catsforbots/cat-work.git
          CAT_PLATFORM_RECEIPT_DIRECTORY: ${{ github.workspace }}/platform-receipts
        run: client/release/run-frontend-launch-gate.sh "${GITHUB_REF_NAME}" staged/personal staged/commercial
      - name: Publish Personal release
        run: >-
          client/release/publish-release.sh --edition personal --staged-tree "${GITHUB_WORKSPACE}/staged/personal"
          --repository https://github.com/catsforbots/cat.git --version "${GITHUB_REF_NAME}" --git "$(command -v git)"
      - name: Publish Commercial release
        run: >-
          client/release/publish-release.sh --edition commercial --staged-tree "${GITHUB_WORKSPACE}/staged/commercial"
          --repository https://github.com/catsforbots/cat-work.git --version "${GITHUB_REF_NAME}" --git "$(command -v git)"
