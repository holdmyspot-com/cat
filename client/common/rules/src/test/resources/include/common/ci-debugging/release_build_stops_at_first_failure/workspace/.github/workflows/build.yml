name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON list of the platforms to build on
        required: false
        default: '["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64"]'
      remote_session_public_key:
        description: Public key that may join a remote session; leave empty for a normal run
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms || '["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64"]') }}
    runs-on: >-
      ${{ fromJSON('{"linux-x64": "ubuntu-24.04", "linux-arm64": "ubuntu-24.04-arm", "macos-x64": "macos-13",
      "macos-arm64": "macos-15", "windows-x64": "windows-2025"}')[matrix.platform] }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      UPTERM_VERSION: v0.40.0
      REMOTE_SESSION_PUBLIC_KEY: ${{ inputs.remote_session_public_key }}
      REMOTE_SESSION_DIR: ${{ runner.temp }}/remote-session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Start remote session
        if: inputs.remote_session_public_key != ''
        run: ci/remote-session/start.sh
      - name: Wait for readiness
        if: inputs.remote_session_public_key != ''
        run: ci/remote-session/wait-ready.sh
      - name: Build
        run: ./mvnw -B verify
      - name: Hold worker
        if: always() && inputs.remote_session_public_key != ''
        run: ci/remote-session/hold.sh
      - name: Clean up
        if: always()
        run: rm -rf "$REMOTE_SESSION_DIR"
